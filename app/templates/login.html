<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=7">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>用户登录</h1>
                <p>登录后进入岗位能力达成诊断系统</p>
            </div>

            {% if message %}
            <p class="success-message">{{ message }}</p>
            {% endif %}

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}

            <form action="/login" method="post" class="auth-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="请输入用户名"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="请输入密码"
                        required
                    >
                </div>

                <div class="form-group">
                    <span class="auth-field-label">登录身份</span>
                    <div class="auth-role-options">
                        {% for option in role_options %}
                        <label class="auth-role-option {% if selected_role == option.value %}active{% endif %}">
                            <input
                                type="radio"
                                name="user_role"
                                value="{{ option.value }}"
                                {% if selected_role == option.value %}checked{% endif %}
                            >
                            <strong>{{ option.label }}</strong>
                            <small>{{ option.description }}</small>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="auth-btn">登录</button>
            </form>

            <div class="auth-footer">
                <span>还没有账号？</span>
                <a href="/register">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
