<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=6">
</head>
<body>
    <div class="container">
        <h1>岗位能力达成学生成长诊断与精准就业智能体系统</h1>

        {% if username %}
        <p class="subtitle">
            当前登录用户：{{ username }}
            <a href="/logout" class="link">退出登录</a>
        </p>
        {% endif %}

        {% if message %}
        <p class="success-message">
            {{ message }}
        </p>
        {% endif %}

        <p class="subtitle">
            面向学生、学校、企业三方协同的人才培养与精准就业智能体系统
        </p>

        <div class="card">
            <h2>系统核心功能</h2>
            <ul>
                <li>学生能力画像分析</li>
                <li>岗位能力匹配分析</li>
                <li>个性化成长路径规划</li>
                <li>智能职业发展建议</li>
                <li>Word / PDF 报告导出</li>
            </ul>
        </div>

        <div class="button-group">

            <a class="btn" href="/student/input">开始诊断</a>
            <a class="btn secondary-btn" href="/history">查看历史诊断记录</a>
            <a class="btn secondary-btn" href="/growth/trend">个人成长轨迹</a>
        </div>
    </div>
</body>
</html>
